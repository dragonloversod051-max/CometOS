<!DOCTYPE html>
<html>

  <body>

    <head>
      <link rel="stylesheet" type="text/css" href="style.css" />

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Playpen+Sans">
    
  <!--Welcome Window/ Intro window-->

    <div class = "window" id = "welcome" style = " width:400px; background-color: rgba(250, 250, 250, 0.9);">
      <p class = "closeButton" id = "welcomeClose">❌</p>
      <h1 style = "text-align: center; font-family:Comic Sans, cursive;">CometOS</h1>
      <p style = "font-family: 'Times New Roman', Times, serif;">My name is <dfn>Comet</dfn>. Welcome to <dfn>CometOS</dfn>. Yes, I agree, very creative. Well, the answers to all <dfn>my</dfn> questions, are within...</p>
      <body style="background-image: url('Arx Nubium.png'); background-size: cover; overflow-y: hidden;"></body>

      <p class = "draggableWindow" id = "welcomeheader">
        ✋
      </p>
    </div>

  <!--Top Bar-->
    <div style = "top: 0px; right: 0px; pointer-events: none;" class = "bar" id = "topBar">
      <div id = "welcomeOpen" style = "border: transparent; width: 80px; height:40px; border-radius: 20px; background-color: rgba(255, 255, 255, 0.9); margin: 5px; pointer-events: auto;">
        <p style = "position: absolute; top:4px; left:2px; margin: 15px; font-family: Marker Felt, fantasy;">CometOS</p>
      </div>

      <p id = "timeElement"; style = "position: absolute; top: 5px; font-family: serif; margin: 15px; right:0px;">
        Time

      </p>

      <p id = "batteryElement"; style = "position: absolute; top:0px; left:50%; transform: translate(-50%); font-family: serif; margin: 15px;">
        Battery</p>

    </div>

  <!--Bottom bar-->
    <div class = "bar" style = "bottom: 0px; right: 0px; pointer-events: none;" id = "bottomBar">

      <div id = "NBicon" style = "width: 50px; height: 50px; position: absolute; left: 10px;">
        <img src = "Notes icon.png" id = "notebookOpen" style = "width: 50px; height: 50px; position: absolute; pointer-events: auto;" id = "notebookOpen">
      </div>


    </div>

  <!--Notebook app-->

    <div class = "window" id = "notebook" style = " width:500px; height: 700px; background-color: rgba(250, 250, 250, 1); display: none; max-height: 100%;">
      <p class = "closeButton" id = "notebookClose">❌</p>
        <div id = "NotesSidebar" style = "display: flex; flex-direction: column; background-color: rgba(228, 226, 226, 0.9); width: 80px; height: 100%; left: 0px; top:0px; bottom: 0px;" class = "bar"> 
        <p class = "draggableWindow" id = "notebookheader">
          ✋
        </p>

        
      </div>
     
      <div style = "overflow-y: auto; max-height: 100%;">
                <h1 style = "text-align: center; font-family: Comic Sans, cursive; ">Fantasy Notes</h1>

          <!--Main Info-->
          <div style = "margin-left: 180px;">
            <p contenteditable = "false" style = "display: cover;">
              <strong>Name: </strong>Comet
              <br><strong>Academy: </strong>Arx Nubium
              <br><strong>Year: </strong>1
      </div>

      <div id ="noteContent" style = "padding-left:0px; text-align:left;">

      </div>
